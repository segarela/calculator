<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <main class="calculator">
        <!-- Экран: результат вычислений -->
        <div class="calculator__display">
            <span class="calculator__result" id="calc-result">0</span>
        </div>

        <!-- Кнопки -->
        <div class="calculator__keys">
            <!-- Верхний ряд: функциональные -->
            <button class="key key--function" data-action="clear" data-value="AC">AC</button>
            <button class="key key--function" data-action="backspace" data-value="backspace">⌫</button>
            <button class="key key--function" data-action="percent" data-value="%">%</button>
            <button class="key key--operator" data-action="operator" data-value="/">÷</button>

            <!-- Ряды с цифрами -->
            <button class="key key--number" data-action="digit" data-value="7">7</button>
            <button class="key key--number" data-action="digit" data-value="8">8</button>
            <button class="key key--number" data-action="digit" data-value="9">9</button>
            <button class="key key--operator" data-action="operator" data-value="*">×</button>

            <button class="key key--number" data-action="digit" data-value="4">4</button>
            <button class="key key--number" data-action="digit" data-value="5">5</button>
            <button class="key key--number" data-action="digit" data-value="6">6</button>
            <button class="key key--operator" data-action="operator" data-value="-">−</button>

            <button class="key key--number" data-action="digit" data-value="1">1</button>
            <button class="key key--number" data-action="digit" data-value="2">2</button>
            <button class="key key--number" data-action="digit" data-value="3">3</button>
            <button class="key key--operator" data-action="operator" data-value="+">+</button>

            <!-- Нижний ряд: ноль на две ячейки -->
            <button class="key key--number key--wide" data-action="digit" data-value="0">0</button>
            <button class="key key--number" data-action="decimal" data-value=".">.</button>
            <button class="key key--operator" data-action="equals" data-value="=">=</button>
        </div>
    </main>

    <script type="module" src="js/main.js"></script>
</body>

</html>
